name: Invoke Night Garden deploy bridge
on:
  push:
    branches: [nightgarden-prod-runner-20260921]
    paths:
      - '.github/workflows/nightgarden-prod-runner.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke production bridge
        run: |
          set -euo pipefail
          curl -sS -i https://timeline.iverfinne.no/api/_nightgarden-deploy
